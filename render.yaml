services:
  - type: web
    name: aftercare-api
    runtime: docker
    plan: free
    region: oregon
    branch: main
    autoDeployTrigger: commit
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Must match the browser's Origin exactly — app.ts sets
      # `cors({ origin: WEB_ORIGIN ?? false })`, so a mismatch blocks every
      # request from the real site. This is the production domain; preview
      # deployments are served from generated subdomains and will be refused.
      - key: WEB_ORIGIN
        value: https://marinhackstigermygoat.vercel.app
      - key: API_RATE_LIMIT
        value: "500"
      - key: UPLOAD_RATE_LIMIT
        value: "100"
      - key: MOCK_INTEGRATIONS
        value: "false"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: STORAGE_ENCRYPTION_KEY
        sync: false
      - key: GOOGLE_STATE_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      # Free-tier AI: OpenRouter `:free` models and Gemini Flash fall back
      # automatically when a paid OpenAI quota runs out.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY_PRIMARY
        sync: false
      - key: GEMINI_API_KEY_FALLBACK
        sync: false
      - key: AI_TIMEOUT_MS
        value: "45000"
