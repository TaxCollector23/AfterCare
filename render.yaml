services:
  - type: web
    name: aftercare-api
    runtime: docker
    plan: free
    region: oregon
    branch: main
    autoDeployTrigger: commit
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Comma-separated browser origins (see src/cors.ts). Every deployment that
      # talks to this API cross-origin must be listed, or its preflight is
      # refused and the site just looks broken. The `*.vercel.app` entry covers
      # preview deployments and any additional Vercel project for this app.
      - key: WEB_ORIGIN
        value: https://aftercare-web-eta.vercel.app,https://marinhacksrtigermygoat.vercel.app,https://*.vercel.app
      - key: API_RATE_LIMIT
        value: "500"
      - key: UPLOAD_RATE_LIMIT
        value: "100"
      - key: MOCK_INTEGRATIONS
        value: "false"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: STORAGE_ENCRYPTION_KEY
        sync: false
      - key: GOOGLE_STATE_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      # Free-tier AI: OpenRouter `:free` models and Gemini Flash fall back
      # automatically when a paid OpenAI quota runs out.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY_PRIMARY
        sync: false
      - key: GEMINI_API_KEY_FALLBACK
        sync: false
      - key: AI_TIMEOUT_MS
        value: "45000"
