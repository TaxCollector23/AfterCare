services:
  - type: web
    name: aftercare-api
    runtime: docker
    plan: free
    region: oregon
    branch: main
    autoDeployTrigger: commit
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Must match the browser's Origin exactly — app.ts sets
      # `cors({ origin: WEB_ORIGIN ?? false })`, so a mismatch blocks every
      # request from the real site. This is the production domain; preview
      # deployments are served from generated subdomains and will be refused.
      - key: WEB_ORIGIN
        value: https://aftercare-web-eta.vercel.app
      - key: API_RATE_LIMIT
        value: "500"
      - key: UPLOAD_RATE_LIMIT
        value: "100"
      - key: MOCK_INTEGRATIONS
        value: "false"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Set by hand in the dashboard, and NOT with Render's "Generate" button —
      # that produces a random string of the wrong length, and every upload then
      # fails with "STORAGE_ENCRYPTION_KEY must decode to 32 bytes". It must
      # decode to exactly 32 bytes; base64, base64url, and 64-char hex all work:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
      # Changing it makes already-stored documents unreadable.
      # /health reports storage.encryption: "misconfigured" when it is wrong.
      - key: STORAGE_ENCRYPTION_KEY
        sync: false
      - key: GOOGLE_STATE_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      # Free-tier AI: OpenRouter `:free` models and Gemini Flash fall back
      # automatically when a paid OpenAI quota runs out.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY_PRIMARY
        sync: false
      - key: GEMINI_API_KEY_FALLBACK
        sync: false
      - key: AI_TIMEOUT_MS
        value: "45000"
