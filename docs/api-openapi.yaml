openapi: 3.1.0
info:
  title: DischargeGuide API
  version: 0.1.0-placeholder
  description: Safe development contract. Clinical integrations are not live yet.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: API and provider configuration status
      security: []
      responses:
        "200": { description: Healthy }
  /auth/register:
    post:
      summary: Register and issue 15-minute access plus 7-day refresh tokens
      security: []
      responses:
        "201": { description: Account created }
  /auth/login:
    post:
      summary: Verify credentials and issue access plus refresh tokens
      security: []
      responses:
        "200": { description: Authenticated }
  /auth/refresh:
    post:
      summary: Rotate an access token from a valid refresh token
      security: []
      responses:
        "200": { description: New token pair; the old refresh token is revoked }
        "401": { description: Invalid, expired, or reused refresh token }
  /auth/logout:
    post:
      summary: Revoke the session behind a refresh token (idempotent)
      security: []
      responses:
        "204": { description: Session revoked }
  /upload:
    post:
      summary: Upload discharge instructions and start processing
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [document]
              properties:
                document:
                  type: string
                  format: binary
      responses:
        "202":
          description: Processing started
          content:
            application/json:
              schema:
                type: object
                required: [documentId, status, processUrl, isPlaceholder]
                properties:
                  documentId: { type: string, format: uuid }
                  status: { const: processing }
                  processUrl: { type: string }
                  isPlaceholder: { type: boolean }
        "415": { description: Unsupported file type }
  /process/{documentId}:
    get:
      summary: Stream pipeline progress via Server-Sent Events
      parameters:
        - in: path
          name: documentId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: SSE stream with provider-independent progress or sanitized failure events
          content:
            text/event-stream:
              schema: { type: string }
  /medications:
    get:
      summary: List medications for a recovery plan
      parameters:
        - in: query
          name: documentId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Medication list }
  /medications/{medicationId}/taken:
    post:
      summary: Record that a medication was taken
      parameters:
        - in: path
          name: medicationId
          required: true
          schema: { type: string }
      responses:
        "200": { description: Adherence event recorded }
  /appointments:
    get:
      summary: List upcoming appointments
      parameters:
        - in: query
          name: documentId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Appointment list }
  /appointments/{appointmentId}/calendar:
    post:
      summary: Download an appointment as an ICS calendar event
      parameters:
        - in: path
          name: appointmentId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Calendar file
          content:
            text/calendar: { schema: { type: string } }
  /ask:
    post:
      summary: Ask a document-grounded question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question, documentId]
              properties:
                question: { type: string }
                documentId: { type: string, format: uuid }
      responses:
        "200": { description: Grounded answer or explicit unavailable response }
        "422":
          description: Non-retryable safe validation failure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StructuredAiError" }
        "503":
          description: Missing configuration, retryable outage, or provider exhaustion
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StructuredAiError" }
  /drive/status:
    get:
      summary: Google Drive integration status
      responses:
        "200": { description: Status }
  /drive/auth:
    post:
      summary: Start limited drive.file OAuth
      responses:
        "200": { description: Authorization details }
  /drive/callback:
    get:
      summary: Complete Google OAuth using a signed state token
      security: []
      responses:
        "200": { description: Drive connected }
  /drive/import:
    post:
      summary: Import a discharge document from Drive
      responses:
        "503": { description: Placeholder until OAuth is configured }
  /drive/backup:
    post:
      summary: Back up a recovery guide to Drive
      responses:
        "503": { description: Placeholder until OAuth is configured }
  /accessibility/prefs:
    get:
      summary: Get accessibility preferences
      responses:
        "200": { description: Preferences }
    post:
      summary: Replace accessibility preferences
      responses:
        "200": { description: Updated preferences }
  /documents:
    get:
      summary: List the authenticated user's documents, newest first
      responses:
        "200":
          description: The user's documents
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        filename: { type: string }
                        mimeType: { type: string }
                        status:
                          type: string
                          enum: [uploaded, processing, ready, failed]
                        uploadedAt: { type: string, format: date-time }
                        failure:
                          type: object
                          nullable: true
                          properties:
                            code: { type: string }
                            message: { type: string }
                            retryable: { type: boolean }
                        originalUrl: { type: string }
                        planReady: { type: boolean }
        "401": { description: Missing or invalid bearer token }
  /documents/{documentId}/original:
    get:
      summary: Retrieve the authenticated user's original document
      parameters:
        - in: path
          name: documentId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Decrypted original document }
  /documents/{documentId}:
    delete:
      summary: Delete a document, its file, plan, and related data (retention)
      parameters:
        - in: path
          name: documentId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Document deleted }
        "404": { description: Document not found or not owned by the user }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    StructuredAiError:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties:
        code:
          type: string
          enum:
            - AI_PROVIDER_CONFIG_MISSING
            - AI_PROVIDER_OUTAGE
            - AI_PROVIDER_UNAVAILABLE
            - AI_VALIDATION_FAILED
        message: { type: string }
        retryable: { type: boolean }
